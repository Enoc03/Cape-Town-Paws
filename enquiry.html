<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cape Town Paws | Enquiry</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="header-container">

            <img
                src="images/cape-town-paws-logo.png"
                alt="Cape Town Paws logo"
                class="logo"
            >

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>

    </header>


    <main>

        <!-- Page Banner -->
        <section class="page-banner">

            <h1>Make an Enquiry</h1>

            <p>
                Interested in adopting, fostering, volunteering,
                donating or sponsoring? Send us your details below.
            </p>

        </section>


        <!-- Enquiry Form -->
        <section class="form-section">

            <div class="form-container">

                <h2>Enquiry Form</h2>

                <form>

                    <!-- Full Name -->
                    <div class="form-group">

                        <label for="fullname">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullname"
                            name="fullname"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            required
                        >

                    </div>


                    <!-- Phone Number -->
                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                        >

                    </div>


                    <!-- Enquiry Type -->
                    <div class="form-group">

                        <label for="enquiry-type">
                            Type of Enquiry
                        </label>

                        <select
                            id="enquiry-type"
                            name="enquiry-type"
                            required
                        >

                            <option value="">
                                Select an option
                            </option>

                            <option value="adoption">
                                Adoption
                            </option>

                            <option value="fostering">
                                Fostering
                            </option>

                            <option value="volunteering">
                                Volunteering
                            </option>

                            <option value="donation">
                                Donation
                            </option>

                            <option value="sponsorship">
                                Sponsorship
                            </option>

                        </select>

                    </div>


                    <!-- Message -->
                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            placeholder="Tell us how we can help you"
                            required
                        ></textarea>

                    </div>


                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="form-button"
                    >
                        Submit Enquiry
                    </button>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Cape Town Paws. All rights reserved.
        </p>

    </footer>

</body>

</html>
